# fly.toml app configuration file generated for internationalbc on 2026-08-13T15:07:11Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'internationalbc'
primary_region = 'cdg'

[build]

[env]
  DATABASE_PATH = '/data/maccabi.db'
  PORT = '3000'

[[mounts]]
  source = 'maccabi_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
